<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演練紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

            background: transparent;

        ::-webkit-scrollbar-thumb {

            overflow-wrap: break-word;

            from { opacity: 0; transform: scale(0.95); }

</head>

    <div class="flex flex-1 overflow-hidden relative">

            </div>

            <div class="p-3 border-b border-gray-100">
                <div class="relative">

    <!-- 提示訊息 Modal -->

        <div id="alertModalBox" class="bg-white rounded-2xl w-full max-w-sm mx-4 shadow-2xl border border-gray-100 p-6 text-center transform transition-all scale-95 duration-200">

    <script>
        let contacts = [];
        let currentContactId = null;
        let editingMessageIndex = null;
        let insertingAfterIndex = null;
        let mobileView = 'list';
        const STORAGE_KEY = 'consultation_chat_app_v2';
        let isComposing = false; // 用來追蹤注音/中文輸入法的組字狀態

        window.onload = function() {
            loadData();
            renderContacts();
            
            if (contacts.length === 0) {
                createDefaultSampleData();
            } else if (!currentContactId && contacts.length > 0) {
                if (window.innerWidth >= 768) {
                    selectContact(contacts[0].id);
                } else {
                    updateMobileView('list');
                }
            }

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    document.getElementById('sidebarPanel').classList.remove('-translate-x-full');
                    document.getElementById('mainChatPanel').classList.remove('translate-x-full');
                } else {
                    updateMobileView(currentContactId && mobileView === 'chat' ? 'chat' : 'list');
                }
            });

            const msgInput = document.getElementById('messageInput');

            // 監聽注音/輸入法開始組字事件
            msgInput.addEventListener('compositionstart', function(e) {
                isComposing = true;
            });

            // 監聽注音/輸入法結束組字事件（選字完成）
            msgInput.addEventListener('compositionend', function(e) {
                isComposing = false;
            });

            // 處理按鍵事件：如果在注音組字中（isComposing 為 true），或是按下 Enter 時仍在選字，則不送出訊息
            msgInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    if (isComposing) {
                        return;
                    }
                    e.preventDefault();
                    document.getElementById('messageForm').dispatchEvent(new Event('submit'));
                }
            });
        };

        function updateMobileView(view) {
            mobileView = view;
            const sidebar = document.getElementById('sidebarPanel');
            const mainChat = document.getElementById('mainChatPanel');

            if (window.innerWidth < 768) {
                if (view === 'list') {
                    sidebar.classList.remove('-translate-x-full');
                    mainChat.classList.add('translate-x-full');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    mainChat.classList.remove('translate-x-full');
                }
            } else {
                sidebar.classList.remove('-translate-x-full');
                mainChat.classList.remove('translate-x-full');
            }
        }

        function backToList() {
            updateMobileView('list');
        }

        function createDefaultSampleData() {
            const sampleContact = {
                id: "T01",
                name: "王心理師 (範例)",
                messages: [
                    {
                        role: "teacher",
                        text: "【系統提示】這是演練紀錄示範。您可以透過下方切換「助人者」、「個案」或「註解」來建立對話內容。",
                        time: "09:00"
                    },
                    {
                        role: "helper",
                        text: "哈囉您好，我是今天的實習諮商師王大明，很高興今天能跟您聊聊。請坐，今天想談談什麼呢？",
                        time: "09:01"
                    },
                    {
                        role: "client",
                        text: "老師好... 我最近其實覺得壓力蠻大的，每天晚上都睡不好，腦子一直轉個不停。",
                        time: "09:02"
                    },
                    {
                        role: "teacher",
                        text: "此處助人者展現了開放式問句與溫和的語調，成功邀請個案表達主要困擾。",
                        time: "09:02"
                    },
                    {
                        role: "helper",
                        text: "聽起來最近這段時間您承擔了蠻多壓力的，而且睡眠也受到影響，這一定很辛苦吧。能跟我多說說是什麼事情讓您一直轉個不停嗎？",
                        time: "09:03"
                    },
                    {
                        role: "client",
                        text: "主要是工作上的專案進度快趕不上了，再加上家裡有一些事情需要分心處理，覺得自己好像兩邊都顧不好...",
                        time: "09:04"
                    }
                ]
            };

            contacts.push(sampleContact);
            saveData();
            renderContacts();
            if (window.innerWidth >= 768) {
                selectContact("T01");
            }
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    contacts = JSON.parse(saved);
                } catch (e) {
                    console.error("解析資料失敗", e);
                    contacts = [];
                }
            } else {
                contacts = [];
            }
        }

        function saveData(showNotice = false) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
                updateSaveStatusIndicator();
                if (showNotice) {
                    showAlert("儲存成功", "所有紀錄已成功儲存至瀏覽器！");
                }
            } catch (e) {
                showAlert("儲存失敗", "瀏覽器空間不足或無權限。", false);
            }
        }

        function manualSaveData() {
            saveData(true);
        }

        function updateSaveStatusIndicator() {
            const statusEl = document.getElementById('saveStatus');
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
            statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px] text-brand-500 mr-1.5"></i> 於 ${timeStr} 自動儲存`;
        }

        function filterContacts() {
            renderContactItems();
        }

        function renderContacts() {
            renderContactItems();
        }

        function renderContactItems() {
            const searchInput = document.getElementById('searchInput');
            const keyword = searchInput ? searchInput.value.toLowerCase() : '';
            const contactListEl = document.getElementById('contactList');
            contactListEl.innerHTML = '';

            if (contacts.length === 0) {
                contactListEl.innerHTML = `
                    <div class="p-8 text-center text-gray-400">
                        <i class="fa-solid fa-address-book text-3xl mb-3 opacity-50"></i>
                        <p class="text-sm">目前尚無名單</p>
                        <p class="text-xs mt-1">請點擊上方按鈕新增</p>
                    </div>`;
                return;
            }

            let renderedCount = 0;

            contacts.forEach((contact, index) => {
                if (keyword && !contact.name.toLowerCase().includes(keyword) && !contact.id.toLowerCase().includes(keyword)) return;
                
                renderedCount++;
                const isSelected = contact.id === currentContactId;
                const msgCount = contact.messages.length;
                
                const item = document.createElement('div');
                item.className = `p-4 cursor-pointer transition-all flex items-center justify-between group hover:bg-gray-50 border-l-4 ${isSelected ? 'bg-brand-50/60 border-brand-500' : 'border-transparent'}`;
                item.onclick = () => selectContact(contact.id);

                const infoDiv = document.createElement('div');
                infoDiv.className = "flex items-center space-x-3 flex-1 min-w-0";
                infoDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs shadow-sm shrink-0 border border-brand-200">
                        ${escapeHtml(contact.id.substring(0, 3))}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold text-gray-900 truncate">${escapeHtml(contact.name)}</h4>
                        <p class="text-xs text-gray-400 truncate mt-0.5">${msgCount > 0 ? `共 ${msgCount} 則紀錄` : '尚未開始演練'}</p>
                    </div>
                `;

                const actionDiv = document.createElement('div');
                actionDiv.className = `flex flex-col space-y-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity shrink-0 ml-2`;
                
                const stopPropagation = (e) => e.stopPropagation();

                actionDiv.innerHTML = `
                    <div class="flex items-center space-x-1">
                        <button onclick="moveContact(${index}, -1)" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-gray-800 hover:bg-gray-200 transition-colors disabled:opacity-30" title="上移" ${index === 0 ? 'disabled' : ''}>
                            <i class="fa-solid fa-chevron-up text-[10px]"></i>
                        </button>
                        <button onclick="moveContact(${index}, 1)" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-gray-800 hover:bg-gray-200 transition-colors disabled:opacity-30" title="下移" ${index === contacts.length - 1 ? 'disabled' : ''}>
                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </button>
                        <button onclick="deleteContact(${index})" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-100 transition-colors" title="刪除此名單">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
                
                actionDiv.querySelectorAll('button').forEach(btn => btn.addEventListener('click', stopPropagation));

                item.appendChild(infoDiv);
                item.appendChild(actionDiv);
                contactListEl.appendChild(item);
            });

            if (renderedCount === 0 && keyword) {
                contactListEl.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">找不到符合的結果</div>`;
            }
        }

        function moveContact(index, direction) {
            if (index + direction < 0 || index + direction >= contacts.length) return;
            const temp = contacts[index];
            contacts[index] = contacts[index + direction];
            contacts[index + direction] = temp;
            saveData();
            renderContacts();
        }

        function deleteContact(index) {
            const c = contacts[index];
            if (confirm(`確定要刪除諮商師「${c.name}」及其所有演練紀錄嗎？此動作無法復原。`)) {
                if (currentContactId === c.id) {
                    closeChatInterface();
                }
                contacts.splice(index, 1);
                saveData();
                renderContacts();
            }
        }

        function closeChatInterface() {
            currentContactId = null;
            document.getElementById('noChatSelected').classList.remove('hidden');
            const chatUI = document.getElementById('chatInterface');
            chatUI.classList.remove('invisible', 'opacity-100');
            chatUI.classList.add('invisible', 'opacity-0');
            if (window.innerWidth < 768) {
                updateMobileView('list');
            }
        }

        function selectContact(id) {
            currentContactId = id;
            const contact = contacts.find(c => c.id === id);
            if (!contact) return;

            document.getElementById('noChatSelected').classList.add('hidden');
            const chatUI = document.getElementById('chatInterface');
            chatUI.classList.remove('invisible', 'opacity-0');
            chatUI.classList.add('opacity-100');

            document.getElementById('currentHeaderId').innerText = contact.id;
            document.getElementById('currentHeaderName').innerText = contact.name;
            document.getElementById('currentHeaderAvatar').innerText = contact.id.substring(0, 3);
            document.getElementById('messageInput').focus();

            renderMessages();
            renderContacts(); 
            
            updateMobileView('chat');
        }

        function renderMessages() {
            const contact = contacts.find(c => c.id === currentContactId);
            const container = document.getElementById('messageContainer');
            if (!container) return;
            container.innerHTML = '';

            if (!contact || contact.messages.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center text-gray-400 opacity-60">
                        <i class="fa-regular fa-comments text-4xl mb-3"></i>
                        <p class="text-sm">目前尚無紀錄</p>
                        <p class="text-xs mt-1">請在下方輸入區建立第一筆資料</p>
                    </div>
                `;
                return;
            }

            contact.messages.forEach((msg, index) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = "flex flex-col mb-4 group/msg relative";

                let roleBadge = '';
                let bubbleAlign = '';
                let bubbleStyle = '';

                if (msg.role === 'helper') {
                    bubbleAlign = 'mr-auto items-start';
                    bubbleStyle = 'bg-white text-gray-800 border border-gray-200 shadow-sm rounded-2xl rounded-tl-sm';
                    roleBadge = `<span class="text-[11px] font-bold text-brand-700 mb-1 flex items-center space-x-1"><i class="fa-solid fa-user-doctor"></i><span>助人者</span></span>`;
                } else if (msg.role === 'client') {
                    bubbleAlign = 'ml-auto items-end';
                    bubbleStyle = 'bg-blue-600 text-white shadow-sm rounded-2xl rounded-tr-sm';
                    roleBadge = `<span class="text-[11px] font-bold text-blue-700 mb-1 flex items-center space-x-1 justify-end"><span>個案</span><i class="fa-solid fa-user"></i></span>`;
                } else {
                    bubbleAlign = 'mx-auto items-center max-w-xl w-full';
                    bubbleStyle = 'bg-amber-50 border border-amber-200 text-amber-900 shadow-xs rounded-xl';
                    roleBadge = `<span class="text-[11px] font-bold text-amber-700 mb-1 flex items-center space-x-1"><i class="fa-solid fa-note-sticky"></i><span>督導註解</span></span>`;
                }

                // 時間戳記獨立於文字泡泡外部顯示
                const timeStr = msg.time ? `<div class="text-[10px] text-gray-400 mt-1 px-1 ${msg.role === 'client' ? 'text-right' : msg.role === 'helper' ? 'text-left' : 'text-center'}">${msg.time}</div>` : '';

                messageDiv.innerHTML = `
                    <div class="flex flex-col ${bubbleAlign} max-w-[85%] sm:max-w-[75%] relative">
                        ${msg.role !== 'teacher' ? roleBadge : `<div class="text-center w-full mb-1">${roleBadge}</div>`}
                        <div class="${bubbleStyle} p-3.5 sm:p-4 text-sm sm:text-base break-words-custom relative group w-full">
                            <div class="whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</div>
                        </div>
                        ${timeStr}
                        <!-- 操作按鈕工具列 -->
                        <div class="absolute -top-3 right-2 opacity-0 group-hover/msg:opacity-100 transition-opacity bg-white border border-gray-200 shadow-md rounded-lg flex items-center space-x-1 p-1 z-10">
                            <button onclick="openInsertMessageModal(${index})" class="w-7 h-7 rounded hover:bg-gray-100 text-gray-500 hover:text-brand-600 flex items-center justify-center transition-colors text-xs" title="在此下方插入新訊息">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <button onclick="openEditMessageModal(${index})" class="w-7 h-7 rounded hover:bg-gray-100 text-gray-500 hover:text-blue-600 flex items-center justify-center transition-colors text-xs" title="編輯訊息">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteMessage(${index})" class="w-7 h-7 rounded hover:bg-red-50 text-gray-500 hover:text-red-600 flex items-center justify-center transition-colors text-xs" title="刪除訊息">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(messageDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const roleRadios = document.getElementsByName('speakerRole');
            let selectedRole = 'helper';
            for (const r of roleRadios) {
                if (r.checked) {
                    selectedRole = r.value;
                    break;
                }
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

            contact.messages.push({
                role: selectedRole,
                text: text,
                time: timeStr
            });

            input.value = '';
            saveData();
            renderMessages();
            renderContacts();
            input.focus();
        }

        function deleteMessage(index) {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;
            contact.messages.splice(index, 1);
            saveData();
            renderMessages();
            renderContacts();
        }

        function openEditMessageModal(index) {
            editingMessageIndex = index;
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;
            const msg = contact.messages[index];

            const editRadios = document.getElementsByName('editSpeakerRole');
            for (const r of editRadios) {
                r.checked = (r.value === msg.role);
            }
            document.getElementById('editMessageInput').value = msg.text;

            const modal = document.getElementById('editMessageModal');
            const box = document.getElementById('editMessageModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeEditMessageModal() {
            const modal = document.getElementById('editMessageModal');
            const box = document.getElementById('editMessageModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                editingMessageIndex = null;
            }, 200);
        }

        function handleSaveEditedMessage(e) {
            e.preventDefault();
            if (editingMessageIndex === null) return;
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;

            const editRadios = document.getElementsByName('editSpeakerRole');
            let newRole = 'helper';
            for (const r of editRadios) {
                if (r.checked) {
                    newRole = r.value;
                    break;
                }
            }

            const newText = document.getElementById('editMessageInput').value.trim();
            if (!newText) return;

            contact.messages[editingMessageIndex].role = newRole;
            contact.messages[editingMessageIndex].text = newText;

            saveData();
            renderMessages();
            closeEditMessageModal();
        }

        function openInsertMessageModal(index) {
            insertingAfterIndex = index;
            const insertRadios = document.getElementsByName('insertSpeakerRole');
            for (const r of insertRadios) {
                r.checked = (r.value === 'helper');
            }
            document.getElementById('insertMessageInput').value = '';

            const modal = document.getElementById('insertMessageModal');
            const box = document.getElementById('insertMessageModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeInsertMessageModal() {
            const modal = document.getElementById('insertMessageModal');
            const box = document.getElementById('insertMessageModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                insertingAfterIndex = null;
            }, 200);
        }

        function handleSaveInsertedMessage(e) {
            e.preventDefault();
            if (insertingAfterIndex === null) return;
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;

            const insertRadios = document.getElementsByName('insertSpeakerRole');
            let newRole = 'helper';
            for (const r of insertRadios) {
                if (r.checked) {
                    newRole = r.value;
                    break;
                }
            }

            const newText = document.getElementById('insertMessageInput').value.trim();
            if (!newText) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

            const newMsg = {
                role: newRole,
                text: newText,
                time: timeStr
            };

            contact.messages.splice(insertingAfterIndex + 1, 0, newMsg);

            saveData();
            renderMessages();
            renderContacts();
            closeInsertMessageModal();
        }

        function clearCurrentChat() {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;
            if (confirm(`確定要清空「${contact.name}」的所有對話紀錄嗎？`)) {
                contact.messages = [];
                saveData();
                renderMessages();
                renderContacts();
            }
        }

        function openAddModal() {
            document.getElementById('newContactId').value = '';
            document.getElementById('newContactName').value = '';
            const modal = document.getElementById('addContactModal');
            const box = document.getElementById('addContactModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('addContactModal');
            const box = document.getElementById('addContactModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function handleCreateContact(e) {
            e.preventDefault();
            const id = document.getElementById('newContactId').value.trim();
            const name = document.getElementById('newContactName').value.trim();

            if (!id || !name) return;

            if (contacts.some(c => c.id === id)) {
                showAlert("重複的編號", "此編號已經存在，請使用不同的編號。", false);
                return;
            }

            const newContact = {
                id: id,
                name: name,
                messages: []
            };

            contacts.unshift(newContact);
            saveData();
            renderContacts();
            closeAddModal();
            selectContact(id);
        }

        function showAlert(title, message, isSuccess = true) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconEl = document.getElementById('alertIcon');
            if (isSuccess) {
                iconEl.className = "w-14 h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                iconEl.className = "w-14 h-14 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeAlertModal() {
            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
