<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>諮商演練紀錄與對話管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                        },
                        accent: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .break-words-custom { overflow-wrap: anywhere; word-break: break-word; }
        .drag-over-active { border-top: 3px solid #2563eb !important; }
        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-slate-800 overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 h-14 flex items-center justify-between px-4 sm:px-6 z-20 shrink-0 shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold shadow-sm">
                <i class="fa-solid fa-user-doctor text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-base text-slate-900 leading-tight">諮商演練紀錄與對話管理系統</h1>
                <p class="text-[11px] text-slate-500 hidden sm:block">提供對話拖拉排序、對話插隊與訊息高亮標記</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <!-- Auto Save Status Indicator -->
            <div id="saveStatusIndicator" class="flex items-center space-x-1.5 text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                <i class="fa-solid fa-floppy-disk text-brand-600 text-xs"></i>
                <span class="font-medium text-[11px]">系統自動儲存中</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- Sidebar: Contact/Counselor List -->
        <aside id="sidebarPanel" class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col shrink-0 h-full transition-all duration-300 z-10">
            <!-- Add Counselor Action Banner on top of list -->
            <div class="p-3 border-b border-slate-100 bg-slate-50 flex flex-col space-y-2">
                <button onclick="openAddModal()" class="w-full py-2 px-3 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 active:bg-brand-800 rounded-lg shadow-sm transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>新增諮商師</span>
                </button>
                
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋姓名或編號..." class="w-full pl-9 pr-3 py-1.5 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all">
                </div>
            </div>

            <!-- Drag Hint -->
            <div class="px-3.5 py-1.5 bg-brand-50/60 border-b border-brand-100 flex items-center justify-between text-[11px] text-brand-800">
                <span class="flex items-center space-x-1">
                    <i class="fa-solid fa-grip-vertical text-brand-600"></i>
                    <span>長按可拖拉調整列表順序</span>
                </span>
                <span id="contactCountBadge" class="font-bold text-brand-700 bg-brand-100 px-1.5 py-0.5 rounded-full text-[10px]">0 人</span>
            </div>

            <!-- Contacts List Scroll Area -->
            <div id="contactList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Rendered Dynamically -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col bg-slate-100 h-full min-w-0 relative">

            <!-- Empty State when no counselor selected -->
            <div id="noChatSelected" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-50 z-10">
                <div class="w-16 h-16 rounded-full bg-slate-100 text-slate-300 flex items-center justify-center text-3xl mb-3 shadow-inner">
                    <i class="fa-regular fa-comments"></i>
                </div>
                <h2 class="text-base font-semibold text-slate-700">未選擇諮商師</h2>
                <p class="text-xs text-slate-400 mt-1 max-w-sm">請從左側點擊選擇諮商師名單，或點擊左上方「新增諮商師」按鈕開始演練紀錄。</p>
            </div>

            <!-- Active Chat Interface -->
            <div id="chatInterface" class="flex-1 flex flex-col h-full opacity-0 invisible transition-opacity duration-200">
                
                <!-- Chat Header -->
                <div class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between shrink-0 shadow-2xs">
                    <div class="flex items-center space-x-3 truncate">
                        <button onclick="updateMobileView('list')" class="md:hidden w-8 h-8 rounded-lg text-slate-500 hover:bg-slate-100 flex items-center justify-center">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <div id="currentHeaderAvatar" class="w-9 h-9 rounded-full bg-brand-600 text-white font-bold text-xs flex items-center justify-center shadow-xs shrink-0">
                            --
                        </div>
                        <div class="flex items-center space-x-1.5 truncate">
                            <span id="currentHeaderName" class="font-bold text-sm text-slate-900 truncate">諮商師姓名</span>
                            <button onclick="openEditContactModalForCurrent()" class="w-7 h-7 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-slate-100 flex items-center justify-center transition-colors shrink-0" title="編輯諮商師資料">
                                <i class="fa-solid fa-pen-to-square text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center space-x-1">
                        <button onclick="clearCurrentChat()" class="px-2.5 py-1.5 text-xs text-slate-500 hover:text-accent-600 hover:bg-accent-50 rounded-lg transition-colors flex items-center space-x-1" title="清空當前對話紀錄">
                            <i class="fa-solid fa-broom text-xs"></i>
                            <span class="hidden sm:inline">清空對話</span>
                        </button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div id="messageContainer" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                    <!-- Messages dynamically rendered -->
                </div>

                <!-- Message Input Control Toolbar -->
                <div class="bg-white border-t border-slate-200 p-3 sm:p-4 shrink-0">
                    <form onsubmit="handleSendMessage(event)" class="flex flex-col space-y-2.5 max-w-4xl mx-auto">
                        <!-- Role Selector Tabs -->
                        <div class="flex items-center justify-between text-xs px-1">
                            <span class="text-slate-400 text-[11px] font-medium flex items-center space-x-1">
                                <i class="fa-solid fa-user-gear"></i>
                                <span>發言角色頁籤：</span>
                            </span>
                            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
                                <button type="button" onclick="setMainRoleTab('helper')" id="tab-role-helper" class="px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 bg-white text-brand-700 shadow-xs">
                                    <i class="fa-solid fa-user-doctor text-[10px]"></i>
                                    <span>助人者</span>
                                </button>
                                <button type="button" onclick="setMainRoleTab('client')" id="tab-role-client" class="px-3 py-1 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all flex items-center space-x-1.5">
                                    <i class="fa-solid fa-user text-[10px]"></i>
                                    <span>個案</span>
                                </button>
                                <button type="button" onclick="setMainRoleTab('teacher')" id="tab-role-teacher" class="px-3 py-1 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all flex items-center space-x-1.5">
                                    <i class="fa-solid fa-note-sticky text-[10px]"></i>
                                    <span>註解</span>
                                </button>
                            </div>
                        </div>

                        <!-- Input Textarea & Submit Button -->
                        <div class="flex space-x-2">
                            <textarea id="messageInput" rows="2" placeholder="在此輸入演練對話內容... (按 Shift+Enter 換行，Enter 送出)" class="flex-1 p-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white resize-none transition-all" onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); handleSendMessage(event); }"></textarea>
                            <button type="submit" class="px-4 bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-semibold rounded-xl transition-all shadow-sm flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-paper-plane text-sm"></i>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Modal 1: Add Counselor Modal -->
    <div id="addContactModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
        <div id="addContactModalBox" class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-200 border border-slate-100">
            <h3 class="text-base font-bold text-slate-900 mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-user-plus text-brand-600"></i>
                <span>新增諮商師演練紀錄</span>
            </h3>
            <p class="text-xs text-slate-500 mb-4">請輸入諮商師編號與姓名建立演練紀錄。</p>
            
            <form onsubmit="handleCreateContact(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">諮商師編號</label>
                    <input type="text" id="newContactId" required placeholder="例：01 或 C-102" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">諮商師姓名 / 暱稱</label>
                    <input type="text" id="newContactName" required placeholder="例：王心理師" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition-colors shadow-sm">建立紀錄</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 2: Edit Counselor Modal -->
    <div id="editContactModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
        <div id="editContactModalBox" class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-200 border border-slate-100">
            <h3 class="text-base font-bold text-slate-900 mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-user-pen text-brand-600"></i>
                <span>編輯諮商師資料</span>
            </h3>
            <p class="text-xs text-slate-500 mb-4">更新諮商師編號與姓名資料。</p>
            
            <form onsubmit="handleSaveEditedContact(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">諮商師編號</label>
                    <input type="text" id="editContactId" required placeholder="例：01 或 C-102" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">諮商師姓名 / 暱稱</label>
                    <input type="text" id="editContactName" required placeholder="例：王心理師" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeEditContactModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition-colors shadow-sm">儲存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 3: Edit Message Modal -->
    <div id="editMessageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
        <div id="editMessageModalBox" class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 transform scale-95 transition-transform duration-200 border border-slate-100">
            <h3 class="text-base font-bold text-slate-900 mb-3 flex items-center space-x-2">
                <i class="fa-solid fa-pen text-brand-600"></i>
                <span>編輯演練對話</span>
            </h3>
            <form onsubmit="handleSaveEditedMessage(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-2">發言角色</label>
                    <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
                        <button type="button" onclick="setEditRoleTab('helper')" id="tab-edit-helper" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-center bg-white text-brand-700 shadow-xs">助人者</button>
                        <button type="button" onclick="setEditRoleTab('client')" id="tab-edit-client" class="flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition-all text-center">個案</button>
                        <button type="button" onclick="setEditRoleTab('teacher')" id="tab-edit-teacher" class="flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition-all text-center">註解</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">對話內容</label>
                    <textarea id="editMessageInput" rows="4" required class="w-full p-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeEditMessageModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm">儲存更新</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 4: Insert Message Modal -->
    <div id="insertMessageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
        <div id="insertMessageModalBox" class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 transform scale-95 transition-transform duration-200 border border-slate-100">
            <h3 class="text-base font-bold text-slate-900 mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-turn-down text-brand-600 rotate-90"></i>
                <span>在此下方插入新訊息</span>
            </h3>
            <p class="text-xs text-slate-500 mb-3">插隊對話功能：這筆訊息將直接插在此段對話之後。</p>

            <form onsubmit="handleSaveInsertedMessage(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-2">發言角色</label>
                    <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200 space-x-1">
                        <button type="button" onclick="setInsertRoleTab('helper')" id="tab-insert-helper" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-center bg-white text-brand-700 shadow-xs">助人者</button>
                        <button type="button" onclick="setInsertRoleTab('client')" id="tab-insert-client" class="flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition-all text-center">個案</button>
                        <button type="button" onclick="setInsertRoleTab('teacher')" id="tab-insert-teacher" class="flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition-all text-center">註解</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">插入訊息內容</label>
                    <textarea id="insertMessageInput" rows="3" required placeholder="請輸入插入內容..." class="w-full p-3 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeInsertMessageModal()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm">確認插入</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal 5: Custom Confirmation Dialog -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
        <div id="confirmModalBox" class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center transform scale-95 transition-transform duration-200 border border-slate-100">
            <div class="w-12 h-12 rounded-full bg-accent-50 text-accent-600 flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle" class="text-base font-bold text-slate-900 mb-1">確認執行此動作？</h3>
            <p id="confirmMessage" class="text-xs text-slate-500 mb-6 leading-relaxed">此動作將無法復原。</p>
            <div class="flex space-x-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">取消</button>
                <button onclick="executeConfirmAction()" class="flex-1 py-2 text-xs font-semibold text-white bg-accent-600 hover:bg-accent-700 rounded-lg transition-colors shadow-sm">確定刪除</button>
            </div>
        </div>
    </div>

    <!-- Modal 6: General Alert Modal -->
    <div id="alertModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
        <div id="alertModalBox" class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center transform scale-95 transition-transform duration-200 border border-slate-100">
            <div id="alertIcon" class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-xl mx-auto mb-3 shadow-xs">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="alertTitle" class="text-base font-bold text-slate-900 mb-1">提示訊息</h3>
            <p id="alertMessage" class="text-xs text-slate-500 mb-6 leading-relaxed"></p>
            <button onclick="closeAlertModal()" class="w-full py-2 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition-colors shadow-sm">確定</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const STORAGE_KEY = 'counseling_app_contacts_v3';
        
        let contacts = [];
        let currentContactUuid = null;
        let editingMessageIndex = null;
        let insertingAfterIndex = null;
        let editingContactTargetUuid = null;
        let pendingConfirmAction = null;

        // Active speaker roles state for Tabs
        let activeMainRole = 'helper';
        let activeEditRole = 'helper';
        let activeInsertRole = 'helper';

        // Drag & Drop State
        let dragSourceType = null;
        let dragSourceIndex = null;

        // Default Sample Data
        const sampleContacts = [
            {
                uuid: 'c_default_01',
                id: '01',
                name: '張心理師',
                messages: [
                    { role: 'helper', text: '你好，我是今天與你對話的諮商師。請問今天有什麼想討論的議題嗎？', time: '10:00', highlight: false },
                    { role: 'client', text: '最近工作壓力很大，常常覺得焦慮睡不好...', time: '10:01', highlight: true },
                    { role: 'teacher', text: '【註解】此處展現了良好的同理反應與開場，建議下一步進行情緒反映。', time: '10:02', highlight: false },
                    { role: 'helper', text: '聽起來這份壓力已經影響到了你的睡眠品質，讓你感到相當疲憊對嗎？', time: '10:03', highlight: false }
                ]
            },
            {
                uuid: 'c_default_02',
                id: '02',
                name: '林實習心理師',
                messages: [
                    { role: 'helper', text: '歡迎來到諮商室，請放輕鬆。', time: '14:30', highlight: false },
                    { role: 'client', text: '謝謝心理師。', time: '14:31', highlight: false }
                ]
            }
        ];

        function initApp() {
            loadData();
            renderContacts();
            if (contacts.length > 0) {
                selectContact(contacts[0].uuid);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function selectContact(uuid) {
            currentContactUuid = uuid;
            const contact = contacts.find(c => c.uuid === uuid);
            if (!contact) return;

            const noChat = document.getElementById('noChatSelected');
            if (noChat) noChat.classList.add('hidden');

            const chatUI = document.getElementById('chatInterface');
            if (chatUI) {
                chatUI.classList.remove('invisible', 'opacity-0');
                chatUI.classList.add('opacity-100');
            }

            const avatarEl = document.getElementById('currentHeaderAvatar');
            if (avatarEl) avatarEl.innerText = contact.name.slice(0, 1) || '諮';

            const nameEl = document.getElementById('currentHeaderName');
            if (nameEl) nameEl.innerText = contact.name;

            renderContacts();
            renderMessages();
            updateMobileView('chat');
        }

        function openEditContactModal(uuid) {
            const contact = contacts.find(c => c.uuid === uuid);
            if (!contact) return;
            editingContactTargetUuid = uuid;
            document.getElementById('editContactId').value = contact.id;
            document.getElementById('editContactName').value = contact.name;

            const modal = document.getElementById('editContactModal');
            const box = document.getElementById('editContactModalBox');
            if (!modal || !box) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function openEditContactModalForCurrent() {
            if (currentContactUuid) {
                openEditContactModal(currentContactUuid);
            }
        }

        function closeEditContactModal() {
            const modal = document.getElementById('editContactModal');
            const box = document.getElementById('editContactModalBox');
            if (!modal || !box) return;
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                editingContactTargetUuid = null;
            }, 200);
        }

        function handleSaveEditedContact(e) {
            if (e) e.preventDefault();
            if (!editingContactTargetUuid) return;
            const contact = contacts.find(c => c.uuid === editingContactTargetUuid);
            if (!contact) return;

            const newId = document.getElementById('editContactId').value.trim();
            const newName = document.getElementById('editContactName').value.trim();

            if (!newId || !newName) return;

            contact.id = newId;
            contact.name = newName;

            saveData();
            renderContacts();
            if (currentContactUuid === contact.uuid) {
                selectContact(contact.uuid);
            }
            closeEditContactModal();
        }

        function closeEditMessageModal() {
            const modal = document.getElementById('editMessageModal');
            const box = document.getElementById('editMessageModalBox');
            if (!modal || !box) return;
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                editingMessageIndex = null;
            }, 200);
        }

        function closeInsertMessageModal() {
            const modal = document.getElementById('insertMessageModal');
            const box = document.getElementById('insertMessageModalBox');
            if (!modal || !box) return;
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                insertingAfterIndex = null;
            }, 200);
        }

        function handleContactDragStart(e, index, item) {
            dragSourceType = 'contact';
            dragSourceIndex = index;
            item.classList.add('opacity-50');
            if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        }

        function handleContactDragEnd(e, item) {
            item.classList.remove('opacity-50');
            dragSourceType = null;
            dragSourceIndex = null;
            document.querySelectorAll('#contactList > div').forEach(el => el.classList.remove('drag-over-active'));
        }

        function handleContactDragOver(e, item) {
            if (dragSourceType !== 'contact') return;
            e.preventDefault();
            item.classList.add('drag-over-active');
        }

        function handleContactDragLeave(e, item) {
            item.classList.remove('drag-over-active');
        }

        function handleContactDrop(e, targetIndex, item) {
            if (dragSourceType !== 'contact' || dragSourceIndex === null || dragSourceIndex === targetIndex) return;
            e.preventDefault();
            
            const [movedContact] = contacts.splice(dragSourceIndex, 1);
            contacts.splice(targetIndex, 0, movedContact);
            
            saveData();
            renderContacts();
        }

        function handleMessageDragStart(e, index, item) {
            dragSourceType = 'message';
            dragSourceIndex = index;
            item.classList.add('opacity-40');
            if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        }

        function handleMessageDragEnd(e, item) {
            item.classList.remove('opacity-40');
            dragSourceType = null;
            dragSourceIndex = null;
            document.querySelectorAll('#messageContainer > div').forEach(el => el.classList.remove('drag-over-active'));
        }

        function handleMessageDragOver(e, item) {
            if (dragSourceType !== 'message') return;
            e.preventDefault();
            item.classList.add('drag-over-active');
        }

        function handleMessageDragLeave(e, item) {
            item.classList.remove('drag-over-active');
        }

        function handleMessageDrop(e, targetIndex, item) {
            if (dragSourceType !== 'message' || dragSourceIndex === null || dragSourceIndex === targetIndex) return;
            e.preventDefault();

            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact) return;

            const [movedMsg] = contact.messages.splice(dragSourceIndex, 1);
            contact.messages.splice(targetIndex, 0, movedMsg);

            saveData();
            renderMessages();
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    contacts = JSON.parse(raw);
                    contacts.forEach(c => {
                        if (!c.uuid) c.uuid = 'uuid_' + Math.random().toString(36).substring(2, 9);
                        if (c.messages) {
                            c.messages.forEach(m => {
                                if (m.highlight === undefined) m.highlight = false;
                            });
                        }
                    });
                } else {
                    contacts = JSON.parse(JSON.stringify(sampleContacts));
                    saveData();
                }
            } catch (e) {
                console.warn("localStorage restricted, falling back to in-memory state:", e);
                contacts = JSON.parse(JSON.stringify(sampleContacts));
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
                
                // Visual Auto-save feedback
                const indicator = document.getElementById('saveStatusIndicator');
                if (indicator) {
                    indicator.classList.remove('opacity-60');
                    indicator.classList.add('bg-brand-50', 'text-brand-700', 'border-brand-200');
                    setTimeout(() => {
                        indicator.classList.remove('bg-brand-50', 'text-brand-700', 'border-brand-200');
                    }, 800);
                }
            } catch (e) {
                console.warn("Failed to write to localStorage:", e);
            }
        }

        // --- Tab Switching Handlers ---
        function setMainRoleTab(role) {
            activeMainRole = role;
            ['helper', 'client', 'teacher'].forEach(r => {
                const tab = document.getElementById(`tab-role-${r}`);
                if (!tab) return;
                if (r === role) {
                    tab.className = r === 'teacher' 
                        ? "px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 bg-sky-600 text-white shadow-xs"
                        : "px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1.5 bg-white text-brand-700 shadow-xs";
                } else {
                    tab.className = "px-3 py-1 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all flex items-center space-x-1.5";
                }
            });
        }

        function setEditRoleTab(role) {
            activeEditRole = role;
            ['helper', 'client', 'teacher'].forEach(r => {
                const tab = document.getElementById(`tab-edit-${r}`);
                if (!tab) return;
                if (r === role) {
                    tab.className = "flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-center bg-white text-brand-700 shadow-xs border border-slate-200";
                } else {
                    tab.className = "flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition-all text-center hover:text-slate-900";
                }
            });
        }

        function setInsertRoleTab(role) {
            activeInsertRole = role;
            ['helper', 'client', 'teacher'].forEach(r => {
                const tab = document.getElementById(`tab-insert-${r}`);
                if (!tab) return;
                if (r === role) {
                    tab.className = "flex-1 py-1.5 rounded-lg text-xs font-bold transition-all text-center bg-white text-brand-700 shadow-xs border border-slate-200";
                } else {
                    tab.className = "flex-1 py-1.5 rounded-lg text-xs font-medium text-slate-600 transition-all text-center hover:text-slate-900";
                }
            });
        }

        // Simplified Counselor List Render (Only Name)
        function renderContacts() {
            const contactListEl = document.getElementById('contactList');
            const searchInput = document.getElementById('searchInput');
            const keyword = searchInput ? searchInput.value.trim().toLowerCase() : '';
            if (!contactListEl) return;
            
            contactListEl.innerHTML = '';
            let count = 0;

            contacts.forEach((c, index) => {
                if (keyword && !c.name.toLowerCase().includes(keyword) && !c.id.toLowerCase().includes(keyword)) {
                    return;
                }
                count++;

                const isActive = currentContactUuid === c.uuid;
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl cursor-pointer transition-all flex items-center justify-between group relative select-none border ${isActive ? 'bg-brand-50 border-brand-200 shadow-2xs' : 'bg-white hover:bg-slate-50 border-slate-100 hover:border-slate-200'}`;
                
                item.draggable = true;
                item.addEventListener('dragstart', (e) => handleContactDragStart(e, index, item));
                item.addEventListener('dragend', (e) => handleContactDragEnd(e, item));
                item.addEventListener('dragover', (e) => handleContactDragOver(e, item));
                item.addEventListener('dragleave', (e) => handleContactDragLeave(e, item));
                item.addEventListener('drop', (e) => handleContactDrop(e, index, item));

                item.onclick = () => selectContact(c.uuid);

                // Render strictly Name without ID badge
                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden min-w-0">
                        <div class="text-slate-300 group-hover:text-slate-500 cursor-grab active:cursor-grabbing px-1 transition-colors shrink-0" title="按住可上下拖拉調整排序">
                            <i class="fa-solid fa-grip-vertical text-xs"></i>
                        </div>
                        
                        <div class="truncate text-xs font-semibold text-slate-900">
                            ${escapeHtml(c.name)}
                        </div>
                    </div>

                    <div class="flex items-center space-x-1 opacity-80 sm:opacity-0 group-hover:opacity-100 transition-opacity shrink-0" onclick="event.stopPropagation()">
                        <button onclick="openEditContactModal('${c.uuid}')" class="w-7 h-7 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-slate-100 flex items-center justify-center transition-colors" title="編輯諮商師名稱與編號">
                            <i class="fa-solid fa-pen text-[11px]"></i>
                        </button>
                        <button onclick="confirmDeleteContact('${c.uuid}')" class="w-7 h-7 rounded-lg text-slate-400 hover:text-accent-600 hover:bg-accent-50 flex items-center justify-center transition-colors" title="刪除此諮商師">
                            <i class="fa-solid fa-trash-can text-[11px]"></i>
                        </button>
                    </div>
                `;

                contactListEl.appendChild(item);
            });

            const badge = document.getElementById('contactCountBadge');
            if (badge) badge.innerText = `${count} 人`;

            if (count === 0 && keyword) {
                contactListEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">找不到符合「${escapeHtml(keyword)}」的諮商師</div>`;
            } else if (count === 0) {
                contactListEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs">目前無諮商師紀錄，請點擊上方「新增諮商師」按鈕建立。</div>`;
            }
        }

        function renderMessages(preserveScroll = false) {
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            const container = document.getElementById('messageContainer');
            if (!container) return;

            const previousScrollTop = container.scrollTop;

            container.innerHTML = '';

            if (!contact || !contact.messages || contact.messages.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center text-slate-400 opacity-60 my-12">
                        <i class="fa-regular fa-comments text-4xl mb-3"></i>
                        <p class="text-sm font-medium">目前尚無演練紀錄</p>
                        <p class="text-xs mt-1">請在下方輸入區建立第一筆對話資料</p>
                    </div>
                `;
                return;
            }

            contact.messages.forEach((msg, index) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = "flex flex-col mb-4 group/msg relative transition-all";

                messageDiv.draggable = true;
                messageDiv.addEventListener('dragstart', (e) => handleMessageDragStart(e, index, messageDiv));
                messageDiv.addEventListener('dragend', (e) => handleMessageDragEnd(e, messageDiv));
                messageDiv.addEventListener('dragover', (e) => handleMessageDragOver(e, messageDiv));
                messageDiv.addEventListener('dragleave', (e) => handleMessageDragLeave(e, messageDiv));
                messageDiv.addEventListener('drop', (e) => handleMessageDrop(e, index, messageDiv));

                let roleBadge = '';
                let bubbleAlign = '';
                let bubbleStyle = '';

                // Orange background when Highlighted; White background for Helper & Client; Blue background for Note (註解)
                if (msg.highlight) {
                    // Highlighted state -> Solid Orange background
                    bubbleStyle = 'bg-amber-500 text-white shadow-sm rounded-2xl border border-amber-600';
                } else if (msg.role === 'helper') {
                    // Helper -> White background with dark text
                    bubbleStyle = 'bg-white text-slate-800 border border-slate-300 shadow-2xs rounded-2xl rounded-tl-xs';
                } else if (msg.role === 'client') {
                    // Client -> White background with dark text
                    bubbleStyle = 'bg-white text-slate-800 border border-slate-300 shadow-2xs rounded-2xl rounded-tr-xs';
                } else {
                    // Note (註解) -> Solid Blue background with white text
                    bubbleStyle = 'bg-blue-600 text-white border border-blue-700 shadow-2xs rounded-xl';
                }

                if (msg.role === 'helper') {
                    bubbleAlign = 'mr-auto items-start';
                    roleBadge = `<span class="text-[11px] font-bold ${msg.highlight ? 'text-amber-700' : 'text-slate-600'} mb-1 flex items-center space-x-1"><i class="fa-solid fa-user-doctor text-[10px]"></i><span>助人者</span></span>`;
                } else if (msg.role === 'client') {
                    bubbleAlign = 'ml-auto items-end';
                    roleBadge = `<span class="text-[11px] font-bold ${msg.highlight ? 'text-amber-700' : 'text-slate-600'} mb-1 flex items-center space-x-1 justify-end"><span>個案</span><i class="fa-solid fa-user text-[10px]"></i></span>`;
                } else {
                    bubbleAlign = 'mx-auto items-center max-w-2xl w-full';
                    roleBadge = `<span class="text-[11px] font-bold text-blue-800 mb-1 flex items-center space-x-1"><i class="fa-solid fa-note-sticky text-[10px]"></i><span>註解</span></span>`;
                }

                const timeStr = msg.time ? `<div class="text-[10px] text-slate-400 mt-1 px-1 ${msg.role === 'client' ? 'text-right' : msg.role === 'helper' ? 'text-left' : 'text-center'}">${escapeHtml(msg.time)}</div>` : '';

                const highlightBtnClass = msg.highlight 
                    ? "w-6 h-6 rounded hover:bg-slate-100 text-amber-500 flex items-center justify-center transition-colors text-xs" 
                    : "w-6 h-6 rounded hover:bg-slate-100 text-slate-400 hover:text-amber-500 flex items-center justify-center transition-colors text-xs";

                messageDiv.innerHTML = `
                    <div class="flex flex-col ${bubbleAlign} max-w-[88%] sm:max-w-[78%] relative">
                        ${msg.role !== 'teacher' ? roleBadge : `<div class="text-center w-full mb-1">${roleBadge}</div>`}
                        
                        <div class="flex items-center space-x-1 w-full">
                            <div class="cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-500 opacity-0 group-hover/msg:opacity-100 transition-opacity p-1 shrink-0" title="按住可上下拖拽調整對話順序">
                                <i class="fa-solid fa-grip-vertical text-xs"></i>
                            </div>

                            <div class="${bubbleStyle} p-3.5 sm:p-4 text-sm break-words-custom relative group w-full">
                                <div class="whitespace-pre-wrap leading-relaxed">${escapeHtml(msg.text)}</div>
                            </div>
                        </div>

                        ${timeStr}

                        <div class="absolute -top-3.5 right-2 opacity-0 group-hover/msg:opacity-100 transition-opacity bg-white border border-slate-200 shadow-md rounded-lg flex items-center space-x-0.5 p-1 z-10">
                            <button onclick="toggleHighlightMessage(${index})" class="${highlightBtnClass}" title="${msg.highlight ? '取消高亮' : '⭐️ 高亮標記（橘底）'}">
                                <i class="fa-${msg.highlight ? 'solid' : 'regular'} fa-star"></i>
                            </button>
                            <button onclick="openInsertMessageModal(${index})" class="w-6 h-6 rounded hover:bg-slate-100 text-slate-500 hover:text-brand-600 flex items-center justify-center transition-colors text-xs" title="在此下方插入新訊息">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <button onclick="openEditMessageModal(${index})" class="w-6 h-6 rounded hover:bg-slate-100 text-slate-500 hover:text-brand-600 flex items-center justify-center transition-colors text-xs" title="編輯訊息">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="confirmDeleteMessage(${index})" class="w-6 h-6 rounded hover:bg-accent-50 text-slate-500 hover:text-accent-600 flex items-center justify-center transition-colors text-xs" title="刪除訊息">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(messageDiv);
            });

            if (preserveScroll) {
                container.scrollTop = previousScrollTop;
            } else {
                container.scrollTop = container.scrollHeight;
            }
        }

        // --- Toggle Message Highlight ---
        function toggleHighlightMessage(index) {
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact || !contact.messages[index]) return;

            contact.messages[index].highlight = !contact.messages[index].highlight;
            saveData();
            renderMessages(true);
        }

        function handleSendMessage(e) {
            if (e) e.preventDefault();
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

            contact.messages.push({
                role: activeMainRole,
                text: text,
                time: timeStr,
                highlight: false
            });

            input.value = '';
            saveData();
            renderMessages();
            renderContacts();
            input.focus();
        }

        function openEditMessageModal(index) {
            editingMessageIndex = index;
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact) return;
            const msg = contact.messages[index];

            setEditRoleTab(msg.role || 'helper');
            document.getElementById('editMessageInput').value = msg.text;

            const modal = document.getElementById('editMessageModal');
            const box = document.getElementById('editMessageModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function handleSaveEditedMessage(e) {
            if (e) e.preventDefault();
            if (editingMessageIndex === null) return;
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact) return;

            const newText = document.getElementById('editMessageInput').value.trim();
            if (!newText) return;

            contact.messages[editingMessageIndex].role = activeEditRole;
            contact.messages[editingMessageIndex].text = newText;

            saveData();
            renderMessages();
            closeEditMessageModal();
        }

        function openInsertMessageModal(index) {
            insertingAfterIndex = index;
            setInsertRoleTab('helper');
            document.getElementById('insertMessageInput').value = '';

            const modal = document.getElementById('insertMessageModal');
            const box = document.getElementById('insertMessageModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function handleSaveInsertedMessage(e) {
            if (e) e.preventDefault();
            if (insertingAfterIndex === null) return;
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact) return;

            const newText = document.getElementById('insertMessageInput').value.trim();
            if (!newText) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

            const newMsg = {
                role: activeInsertRole,
                text: newText,
                time: timeStr,
                highlight: false
            };

            contact.messages.splice(insertingAfterIndex + 1, 0, newMsg);

            saveData();
            renderMessages();
            renderContacts();
            closeInsertMessageModal();
        }

        function confirmDeleteMessage(index) {
            showConfirmDialog("刪除對話訊息", "確定要刪除這條對話紀錄嗎？此動作將無法復原。", () => {
                const contact = contacts.find(c => c.uuid === currentContactUuid);
                if (!contact) return;
                contact.messages.splice(index, 1);
                saveData();
                renderMessages();
                renderContacts();
            });
        }

        function confirmDeleteContact(uuid) {
            const contact = contacts.find(c => c.uuid === uuid);
            if (!contact) return;

            showConfirmDialog(`刪除諮商師「${contact.name}」`, `確定要刪除該諮商師及其所有的演練對話紀錄嗎？此動作將無法復原。`, () => {
                if (currentContactUuid === uuid) {
                    closeChatInterface();
                }
                contacts = contacts.filter(c => c.uuid !== uuid);
                saveData();
                renderContacts();
            });
        }

        function clearCurrentChat() {
            const contact = contacts.find(c => c.uuid === currentContactUuid);
            if (!contact) return;

            showConfirmDialog(`清空對話紀錄`, `確定要清空「${contact.name}」的所有對話紀錄嗎？`, () => {
                contact.messages = [];
                saveData();
                renderMessages();
                renderContacts();
            });
        }

        function closeChatInterface() {
            currentContactUuid = null;
            document.getElementById('noChatSelected').classList.remove('hidden');
            const chatUI = document.getElementById('chatInterface');
            chatUI.classList.remove('invisible', 'opacity-100');
            chatUI.classList.add('invisible', 'opacity-0');
            updateMobileView('list');
        }

        function openAddModal() {
            document.getElementById('newContactId').value = '';
            document.getElementById('newContactName').value = '';
            const modal = document.getElementById('addContactModal');
            const box = document.getElementById('addContactModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('addContactModal');
            const box = document.getElementById('addContactModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function handleCreateContact(e) {
            if (e) e.preventDefault();
            const id = document.getElementById('newContactId').value.trim();
            const name = document.getElementById('newContactName').value.trim();

            if (!id || !name) return;

            const newUuid = 'c_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);

            const newContact = {
                uuid: newUuid,
                id: id,
                name: name,
                messages: []
            };

            contacts.unshift(newContact);
            saveData();
            renderContacts();
            closeAddModal();
            selectContact(newUuid);
        }

        function showConfirmDialog(title, message, onConfirm) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = message;
            pendingConfirmAction = onConfirm;

            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                pendingConfirmAction = null;
            }, 200);
        }

        function executeConfirmAction() {
            if (pendingConfirmAction) {
                pendingConfirmAction();
            }
            closeConfirmModal();
        }

        function showAlert(title, message, isSuccess = true) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconEl = document.getElementById('alertIcon');
            
            if (isSuccess) {
                iconEl.className = "w-12 h-12 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-xl mx-auto mb-3 shadow-xs";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                iconEl.className = "w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-xl mx-auto mb-3 shadow-xs";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeAlertModal() {
            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertModalBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function handleSearch() {
            renderContacts();
        }

        function updateMobileView(view) {
            if (window.innerWidth >= 768) return;
            const sidebar = document.getElementById('sidebarPanel');
            if (view === 'chat') {
                sidebar.classList.add('hidden');
            } else {
                sidebar.classList.remove('hidden');
            }
        }

        function exportData() {
            const jsonStr = JSON.stringify(contacts, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `諮商演練備份_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
