<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演練紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .break-words-custom {
            word-break: break-word;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        /* Mobile touch action menu styles */
        .mobile-action-overlay {
            animation: fadeIn 0.15s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden font-sans">

    <header class="bg-white border-b border-gray-200 px-4 sm:px-6 py-4 flex items-center justify-between shadow-sm z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-500 text-white p-2 rounded-xl shadow-md flex items-center justify-center">
                <i class="fa-solid fa-clipboard-list text-xl"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold text-gray-900">演練紀錄</h1>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <span id="saveStatus" class="hidden sm:flex text-xs text-gray-400 items-center">
                <i class="fa-solid fa-circle text-[8px] text-brand-500 mr-1.5"></i> 已就緒
            </span>
            <button onclick="manualSaveData()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium px-3 py-2 rounded-lg transition-all flex items-center space-x-1.5 border border-gray-200 shadow-sm">
                <i class="fa-solid fa-floppy-disk text-brand-600"></i>
                <span class="hidden sm:inline">儲存資料</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- 側邊欄 (列表區) -->
        <aside id="sidebarPanel" class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-full shrink-0 absolute md:relative inset-0 z-20 transition-transform duration-300 transform translate-x-0">
            <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex items-center space-x-2">
                <button type="button" onclick="openAddModal()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm transition-all duration-200 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>新增諮商師</span>
                </button>
            </div>

            <div class="p-3 border-b border-gray-100">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                        <i class="fa-solid fa-search text-sm"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterContacts()" placeholder="搜尋編號或姓名..." class="w-full pl-9 pr-4 py-2 bg-gray-100 border-none rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-shadow">
                </div>
            </div>

            <div id="contactList" class="flex-1 overflow-y-auto divide-y divide-gray-100 bg-white">
                <!-- 動態插入聯絡人 -->
            </div>
        </aside>

        <!-- 主畫面 (對話區) -->
        <main id="mainChatPanel" class="flex-1 flex flex-col bg-gray-50 h-full overflow-hidden absolute md:relative inset-0 z-30 transition-transform duration-300 transform translate-x-full md:translate-x-0">
            
            <div id="noChatSelected" class="absolute inset-0 flex flex-col items-center justify-center p-8 text-center bg-gray-50 z-10">
                <div class="w-20 h-20 bg-gray-200 rounded-full flex items-center justify-center text-gray-400 mb-4 text-3xl shadow-inner">
                    <i class="fa-regular fa-comment-dots"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-700 mb-2">尚未選擇演練紀錄</h3>
                <p class="text-gray-500 max-w-sm text-sm">請從左側列表選擇一位諮商師開始紀錄，或點擊「新增諮商師」建立新對話。</p>
            </div>

            <div id="chatInterface" class="flex-1 flex flex-col h-full invisible opacity-0 transition-opacity duration-200">
                <!-- 對話標頭 -->
                <div class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3.5 flex items-center justify-between shadow-xs shrink-0">
                    <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                        <button onclick="backToList()" class="md:hidden bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-xl flex items-center justify-center transition-colors shrink-0" title="返回列表">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                        <div id="currentHeaderAvatar" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs sm:text-sm shadow-sm overflow-hidden border border-brand-200 shrink-0">
                        </div>
                        <div class="min-w-0">
                            <h2 id="currentHeaderName" class="font-bold text-gray-900 text-sm sm:text-base truncate"></h2>
                            <p class="text-[11px] sm:text-xs text-gray-500 truncate">編號: <span id="currentHeaderId"></span> | 演練紀錄</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <button onclick="clearCurrentChat()" class="text-gray-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition-colors text-xs sm:text-sm flex items-center space-x-1" title="清空此紀錄的所有訊息">
                            <i class="fa-solid fa-eraser"></i> <span class="hidden sm:inline">清空內容</span>
                        </button>
                    </div>
                </div>

                <!-- 訊息區域 -->
                <div id="messageContainer" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3 scroll-smooth">
                    <!-- 對話泡泡 -->
                </div>

                <div class="bg-white border-t border-gray-200 p-3 shadow-sm shrink-0">
                    <form id="messageForm" onsubmit="handleSendMessage(event)" class="space-y-2 max-w-5xl mx-auto">
                        <div class="flex items-center justify-center space-x-2 sm:space-x-3 overflow-x-auto pb-1">
                            
                            <label class="cursor-pointer group shrink-0">
                                <input type="radio" name="speakerRole" value="helper" checked class="peer sr-only">
                                <div class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-600 peer-checked:bg-brand-600 peer-checked:text-white transition-all shadow-sm border border-transparent peer-checked:border-brand-700 hover:bg-gray-200 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-user-doctor"></i>
                                    <span>助人者 (左)</span>
                                </div>
                            </label>

                            <label class="cursor-pointer group shrink-0">
                                <input type="radio" name="speakerRole" value="client" class="peer sr-only">
                                <div class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-600 peer-checked:bg-blue-600 peer-checked:text-white transition-all shadow-sm border border-transparent peer-checked:border-blue-700 hover:bg-gray-200 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-user"></i>
                                    <span>個案 (右)</span>
                                </div>
                            </label>

                            <label class="cursor-pointer group shrink-0">
                                <input type="radio" name="speakerRole" value="teacher" class="peer sr-only">
                                <div class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-600 peer-checked:bg-amber-500 peer-checked:text-white transition-all shadow-sm border border-transparent peer-checked:border-amber-600 hover:bg-gray-200 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-note-sticky"></i>
                                    <span>註解 (置中)</span>
                                </div>
                            </label>
                        </div>

                        <div class="flex items-center space-x-2">
                            <textarea id="messageInput" rows="2" placeholder="請輸入對話或註解內容... (按 Shift+Enter 換行，Enter 送出)" class="flex-1 bg-gray-50 border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 focus:bg-white rounded-xl px-3 py-2 text-sm focus:outline-none transition-all shadow-sm resize-none"></textarea>
                            <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-4 sm:px-5 py-2.5 rounded-xl font-medium text-sm transition-all shadow-md flex items-center justify-center space-x-1.5 shrink-0 self-stretch">
                                <span>傳送</span>
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增諮商師 Modal -->
    <div id="addContactModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-md mx-4 shadow-2xl border border-gray-100 overflow-hidden transform transition-all scale-95 duration-200">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <h3 class="font-bold text-gray-900 text-lg">新增諮商師</h3>
                <button type="button" onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 p-2 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="addContactForm" onsubmit="handleCreateContact(event)" class="p-6 space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">編號 (代號/縮寫)</label>
                    <input type="text" id="newContactId" required placeholder="例如: T01" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                    <p class="text-xs text-gray-400 mt-1.5">此編號將顯示於圓形頭像中。</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">諮商師姓名</label>
                    <input type="text" id="newContactName" required placeholder="例如: 陳心理師" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                </div>
                <div class="pt-4 flex space-x-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 px-4 rounded-xl text-sm transition-colors">
                        取消
                    </button>
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-all shadow-md">
                        確認新增
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 編輯訊息 Modal -->
    <div id="editMessageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-lg mx-4 shadow-2xl border border-gray-100 overflow-hidden transform transition-all scale-95 duration-200">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <div class="flex items-center space-x-3">
                    <h3 class="font-bold text-gray-900 text-lg">編輯內容與類型</h3>
                </div>
                <button type="button" onclick="closeEditMessageModal()" class="text-gray-400 hover:text-gray-600 p-2 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="editMessageForm" onsubmit="handleSaveEditedMessage(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">發話角色 / 類型</label>
                    <select id="editMessageRoleSelect" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                        <option value="helper">助人者 (左側)</option>
                        <option value="client">個案 (右側)</option>
                        <option value="teacher">註解 (置中)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">修改文字</label>
                    <textarea id="editMessageInput" rows="4" required class="w-full bg-gray-50 border border-gray-300 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all resize-none shadow-inner"></textarea>
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeEditMessageModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 px-4 rounded-xl text-sm transition-colors">
                        取消
                    </button>
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-all shadow-md">
                        儲存變更
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 插入訊息 Modal -->
    <div id="insertMessageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-lg mx-4 shadow-2xl border border-gray-100 overflow-hidden transform transition-all scale-95 duration-200">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <div class="flex items-center space-x-3">
                    <h3 class="font-bold text-gray-900 text-lg">在此項目下方插入新訊息</h3>
                </div>
                <button type="button" onclick="closeInsertMessageModal()" class="text-gray-400 hover:text-gray-600 p-2 rounded-lg hover:bg-gray-200 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="insertMessageForm" onsubmit="handleSaveInsertedMessage(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">發話角色 / 類型</label>
                    <select id="insertMessageRoleSelect" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                        <option value="helper">助人者 (左側)</option>
                        <option value="client">個案 (右側)</option>
                        <option value="teacher">註解 (置中)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">訊息內容</label>
                    <textarea id="insertMessageInput" rows="4" required placeholder="請輸入要插入的內容..." class="w-full bg-gray-50 border border-gray-300 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all resize-none shadow-inner"></textarea>
                </div>
                <div class="pt-2 flex space-x-3">
                    <button type="button" onclick="closeInsertMessageModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-3 px-4 rounded-xl text-sm transition-colors">
                        取消
                    </button>
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition-all shadow-md">
                        確認插入
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 提示訊息 Modal -->
    <div id="alertModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm mx-4 shadow-2xl border border-gray-100 p-6 text-center transform transition-all scale-95 duration-200">
            <div id="alertIcon" class="w-14 h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 id="alertTitle" class="font-bold text-gray-900 text-lg mb-2">提示</h4>
            <p id="alertMessage" class="text-sm text-gray-500 mb-6 leading-relaxed">內容訊息...</p>
            <button onclick="closeAlertModal()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition-all shadow-md">
                我知道了
            </button>
        </div>
    </div>

    <script>
        let contacts = [];
        let currentContactId = null;
        let editingMessageIndex = null;
        let insertingAfterIndex = null;
        let mobileView = 'list';
        const STORAGE_KEY = 'consultation_chat_app_v2';

        window.onload = function() {
            loadData();
            renderContacts();
            
            if (contacts.length === 0) {
                createDefaultSampleData();
            } else if (!currentContactId && contacts.length > 0) {
                if (window.innerWidth >= 768) {
                    selectContact(contacts[0].id);
                } else {
                    updateMobileView('list');
                }
            }

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    document.getElementById('sidebarPanel').classList.remove('-translate-x-full');
                    document.getElementById('mainChatPanel').classList.remove('translate-x-full');
                } else {
                    updateMobileView(currentContactId && mobileView === 'chat' ? 'chat' : 'list');
                }
            });

            document.getElementById('messageInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('messageForm').dispatchEvent(new Event('submit'));
                }
            });
        };

        function updateMobileView(view) {
            mobileView = view;
            const sidebar = document.getElementById('sidebarPanel');
            const mainChat = document.getElementById('mainChatPanel');

            if (window.innerWidth < 768) {
                if (view === 'list') {
                    sidebar.classList.remove('-translate-x-full');
                    mainChat.classList.add('translate-x-full');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    mainChat.classList.remove('translate-x-full');
                }
            } else {
                sidebar.classList.remove('-translate-x-full');
                mainChat.classList.remove('translate-x-full');
            }
        }

        function backToList() {
            updateMobileView('list');
        }

        function createDefaultSampleData() {
            const sampleContact = {
                id: "T01",
                name: "王心理師 (範例)",
                messages: [
                    {
                        role: "teacher",
                        text: "【系統提示】這是演練紀錄示範。您可以透過下方切換「助人者」、「個案」或「註解」來建立對話內容。",
                        time: "09:00"
                    },
                    {
                        role: "helper",
                        text: "哈囉您好，我是今天的實習諮商師王大明，很高興今天能跟您聊聊。請坐，今天想談談什麼呢？",
                        time: "09:01"
                    },
                    {
                        role: "client",
                        text: "老師好... 我最近其實覺得壓力蠻大的，每天晚上都睡不好，腦子一直轉個不停。",
                        time: "09:02"
                    },
                    {
                        role: "teacher",
                        text: "此處助人者展現了開放式問句與溫和的語調，成功邀請個案表達主要困擾。",
                        time: "09:02"
                    },
                    {
                        role: "helper",
                        text: "聽起來最近這段時間您承擔了蠻多壓力的，而且睡眠也受到影響，這一定很辛苦吧。能跟我多說說是什麼事情讓您一直轉個不停嗎？",
                        time: "09:03"
                    },
                    {
                        role: "client",
                        text: "主要是工作上的專案進度快趕不上了，再加上家裡有一些事情需要分心處理，覺得自己好像兩邊都顧不好...",
                        time: "09:04"
                    }
                ]
            };

            contacts.push(sampleContact);
            saveData();
            renderContacts();
            if (window.innerWidth >= 768) {
                selectContact("T01");
            }
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    contacts = JSON.parse(saved);
                } catch (e) {
                    console.error("解析資料失敗", e);
                    contacts = [];
                }
            } else {
                contacts = [];
            }
        }

        function saveData(showNotice = false) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
                updateSaveStatusIndicator();
                if (showNotice) {
                    showAlert("儲存成功", "所有紀錄已成功儲存至瀏覽器！");
                }
            } catch (e) {
                showAlert("儲存失敗", "瀏覽器空間不足或無權限。", false);
            }
        }

        function manualSaveData() {
            saveData(true);
        }

        function updateSaveStatusIndicator() {
            const statusEl = document.getElementById('saveStatus');
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false });
            statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px] text-brand-500 mr-1.5"></i> 於 ${timeStr} 自動儲存`;
        }

        function filterContacts() {
            renderContactItems();
        }

        function renderContacts() {
            filterContacts();
        }

        function renderContactItems() {
            const searchInput = document.getElementById('searchInput');
            const keyword = searchInput ? searchInput.value.toLowerCase() : '';
            const contactListEl = document.getElementById('contactList');
            contactListEl.innerHTML = '';

            if (contacts.length === 0) {
                contactListEl.innerHTML = `
                    <div class="p-8 text-center text-gray-400">
                        <i class="fa-solid fa-address-book text-3xl mb-3 opacity-50"></i>
                        <p class="text-sm">目前尚無名單</p>
                        <p class="text-xs mt-1">請點擊上方按鈕新增</p>
                    </div>`;
                return;
            }

            let renderedCount = 0;

            contacts.forEach((contact, index) => {
                if (keyword && !contact.name.toLowerCase().includes(keyword) && !contact.id.toLowerCase().includes(keyword)) return;
                
                renderedCount++;
                const isSelected = contact.id === currentContactId;
                const msgCount = contact.messages.length;
                
                const item = document.createElement('div');
                item.className = `p-4 cursor-pointer transition-all flex items-center justify-between group hover:bg-gray-50 border-l-4 ${isSelected ? 'bg-brand-50/60 border-brand-500' : 'border-transparent'}`;

                const infoDiv = document.createElement('div');
                infoDiv.className = "flex items-center space-x-3 flex-1 min-w-0";
                infoDiv.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-700 font-bold flex items-center justify-center text-xs shadow-sm shrink-0 border border-brand-200">

                        <h4 class="text-sm font-bold text-gray-900 truncate">${escapeHtml(contact.name)}</h4>

                const actionDiv = document.createElement('div');
                actionDiv.className = `flex flex-col space-y-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity shrink-0 ml-2`;
                
                const stopPropagation = (e) => e.stopPropagation();

                actionDiv.innerHTML = `
                    <div class="flex items-center space-x-1">

                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </button>
                        <button onclick="deleteContact(${index})" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-red-100 transition-colors" title="刪除此名單">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                `;
                
                actionDiv.querySelectorAll('button').forEach(btn => btn.addEventListener('click', stopPropagation));

                item.appendChild(infoDiv);
                item.appendChild(actionDiv);

            });

            if (renderedCount === 0 && keyword) {
                contactListEl.innerHTML = `<div class="p-6 text-center text-gray-400 text-sm">找不到符合的結果</div>`;
            }
        }

        function moveContact(index, direction) {
            if (index + direction < 0 || index + direction >= contacts.length) return;
            const temp = contacts[index];
            contacts[index] = contacts[index + direction];
            contacts[index + direction] = temp;
            saveData();
            renderContacts();
        }

        function deleteContact(index) {
            const c = contacts[index];
            if (confirm(`確定要刪除諮商師「${c.name}」及其所有演練紀錄嗎？此動作無法復原。`)) {
                if (currentContactId === c.id) {
                    closeChatInterface();
                }
                contacts.splice(index, 1);
                saveData();
                renderContacts();
            }
        }

        function closeChatInterface() {
            currentContactId = null;
            document.getElementById('noChatSelected').classList.remove('hidden');
            const chatUI = document.getElementById('chatInterface');
            chatUI.classList.remove('invisible', 'opacity-100');
            chatUI.classList.add('invisible', 'opacity-0');
            if (window.innerWidth < 768) {
                updateMobileView('list');
            }

        function selectContact(id) {
            currentContactId = id;
            const contact = contacts.find(c => c.id === id);

            document.getElementById('noChatSelected').classList.add('hidden');
            const chatUI = document.getElementById('chatInterface');
            chatUI.classList.remove('invisible', 'opacity-0');
            chatUI.classList.add('opacity-100');

            document.getElementById('currentHeaderId').innerText = contact.id;
            document.getElementById('currentHeaderName').innerText = contact.name;
            document.getElementById('currentHeaderAvatar').innerText = contact.id.substring(0, 3);
            document.getElementById('messageInput').focus();

            renderMessages();
            renderContacts();

                } else {

                    row.className = "flex flex-col items-center w-full group relative my-3 select-none";
                    row.innerHTML = `

                            <div class="flex items-center justify-center space-x-1 text-[11px] font-bold text-amber-700 mb-1">
                                <i class="fa-solid fa-note-sticky"></i>
                                <span>註解</span>

                        <div class="hidden md:flex flex-wrap items-center justify-center gap-1.5 mt-1.5 opacity-0 group-hover:opacity-100 transition-opacity bg-amber-100/60 p-1.5 rounded-lg border border-amber-200/50 shadow-xs">
                            ${orderButtonsHtml}
                            <button onclick="openInsertMessageModal(${index})" class="text-[11px] text-gray-700 hover:text-brand-600 hover:bg-white px-2 py-0.5 rounded transition-colors flex items-center space-x-1 font-medium" title="在此下方插入">
                                <i class="fa-solid fa-plus text-[9px]"></i><span>插入</span>

                            <button onclick="openEditMessageModal(${index})" class="text-[11px] text-gray-700 hover:text-blue-600 hover:bg-white px-2 py-0.5 rounded transition-colors flex items-center space-x-1 font-medium" title="編輯">

        // 手機版長按彈出的操作選單 Modal
        function showMobileActionMenu(index) {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;
            const msg = contact.messages[index];
            if (!msg) return;

            // 移除舊有的 mobile action menu 如果存在
            const existingMenu = document.getElementById('mobileActionMenuModal');
            if (existingMenu) existingMenu.remove();

            const roleName = msg.role === 'helper' ? '助人者' : msg.role === 'client' ? '個案' : '註解';
            const snippetText = msg.text.length > 30 ? msg.text.substring(0, 30) + '...' : msg.text;

            const modalHtml = `
                <div id="mobileActionMenuModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-end sm:items-center justify-center z-50 mobile-action-overlay">
                    <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-sm mx-0 sm:mx-4 shadow-2xl border border-gray-100 overflow-hidden p-4 space-y-3">
                        <div class="flex items-center justify-between pb-2 border-b border-gray-100">
                            <div>
                                <span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-700">${roleName}訊息選項</span>
                                <p class="text-xs text-gray-500 mt-1 truncate max-w-[250px]">「${escapeHtml(snippetText)}」</p>
                            </div>
                            <button onclick="closeMobileActionMenu()" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg">
                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <div class="col-span-2 flex items-center justify-between bg-gray-50 p-2 rounded-xl border border-gray-200">
                                <span class="text-xs font-medium text-gray-700 ml-1">調整上下順序</span>
                                <div class="flex items-center space-x-2">
                                    <button onclick="closeMobileActionMenu(); moveMessage(${index}, -1);" class="bg-white hover:bg-gray-100 text-gray-700 text-xs px-3 py-1.5 rounded-lg border border-gray-300 shadow-xs flex items-center space-x-1 disabled:opacity-30" ${index === 0 ? 'disabled' : ''}>
                                        <i class="fa-solid fa-arrow-up"></i><span>上移</span>
                                    </button>
                                    <button onclick="closeMobileActionMenu(); moveMessage(${index}, 1);" class="bg-white hover:bg-gray-100 text-gray-700 text-xs px-3 py-1.5 rounded-lg border border-gray-300 shadow-xs flex items-center space-x-1 disabled:opacity-30" ${index === contact.messages.length - 1 ? 'disabled' : ''}>
                                        <i class="fa-solid fa-arrow-down"></i><span>下移</span>
                                    </button>
                                </div>
                            </div>

                            <button onclick="closeMobileActionMenu(); openInsertMessageModal(${index});" class="bg-brand-50 hover:bg-brand-100 text-brand-700 font-medium py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-1.5 border border-brand-200 transition-colors">
                                <i class="fa-solid fa-plus"></i><span>在此下方插入</span>
                            </button>
                            <button onclick="closeMobileActionMenu(); openEditMessageModal(${index});" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-1.5 border border-blue-200 transition-colors">
                                <i class="fa-solid fa-pen"></i><span>編輯此訊息</span>
                            </button>
                            
                            <button onclick="closeMobileActionMenu(); deleteMessage(${index});" class="col-span-2 bg-red-50 hover:bg-red-100 text-red-600 font-medium py-2.5 px-3 rounded-xl text-xs flex items-center justify-center space-x-1.5 border border-red-200 transition-colors">
                                <i class="fa-solid fa-trash-can"></i><span>刪除此訊息</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // 點擊背景可關閉
            document.getElementById('mobileActionMenuModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeMobileActionMenu();
                }
            });
        }

        function closeMobileActionMenu() {
            const menu = document.getElementById('mobileActionMenuModal');
            if (menu) menu.remove();
        }

        function moveMessage(index, direction) {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= contact.messages.length) return;

            const temp = contact.messages[index];
            contact.messages[index] = contact.messages[targetIndex];
            contact.messages[targetIndex] = temp;

            saveData();
            renderMessages();
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const roleRadio = document.querySelector('input[name="speakerRole"]:checked');
            const role = roleRadio ? roleRadio.value : 'helper';

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

            contact.messages.push({
                role: role,
                text: text,
                time: timeStr
            });

            input.value = '';
            input.focus();
            saveData();
            renderMessages();
            renderContacts();
        }

        function clearCurrentChat() {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;

            if (confirm(`確定要清空「${contact.name}」的所有演練紀錄嗎？`)) {
                contact.messages = [];
                saveData();
                renderMessages();
                renderContacts();
            }
        }

        function deleteMessage(index) {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;

            if (confirm("確定要刪除這筆紀錄嗎？")) {
                contact.messages.splice(index, 1);
                saveData();
                renderMessages();
                renderContacts();
            }
        }

        function openEditMessageModal(index) {
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact) return;
            const msg = contact.messages[index];
            if (!msg) return;

            editingMessageIndex = index;
            document.getElementById('editMessageRoleSelect').value = msg.role;
            document.getElementById('editMessageInput').value = msg.text;

            const modal = document.getElementById('editMessageModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.transform').classList.remove('scale-95');
                modal.querySelector('.transform').classList.add('scale-100');
            }, 10);
        }

        function closeEditMessageModal() {
            const modal = document.getElementById('editMessageModal');
            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                editingMessageIndex = null;
            }, 200);
        }

        function handleSaveEditedMessage(e) {
            e.preventDefault();
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact || editingMessageIndex === null) return;

            const newRole = document.getElementById('editMessageRoleSelect').value;
            const newText = document.getElementById('editMessageInput').value.trim();
            if (!newText) return;

            contact.messages[editingMessageIndex].role = newRole;
            contact.messages[editingMessageIndex].text = newText;

            saveData();
            renderMessages();
            closeEditMessageModal();
        }

        function openInsertMessageModal(index) {
            insertingAfterIndex = index;
            document.getElementById('insertMessageRoleSelect').value = 'helper';
            document.getElementById('insertMessageInput').value = '';

            const modal = document.getElementById('insertMessageModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.transform').classList.remove('scale-95');
                modal.querySelector('.transform').classList.add('scale-100');
            }, 10);
        }

        function closeInsertMessageModal() {
            const modal = document.getElementById('insertMessageModal');
            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                insertingAfterIndex = null;
            }, 200);
        }

        function handleSaveInsertedMessage(e) {
            e.preventDefault();
            const contact = contacts.find(c => c.id === currentContactId);
            if (!contact || insertingAfterIndex === null) return;

            const role = document.getElementById('insertMessageRoleSelect').value;
            const text = document.getElementById('insertMessageInput').value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

            const newMsg = {
                role: role,
                text: text,
                time: timeStr
            };

            contact.messages.splice(insertingAfterIndex + 1, 0, newMsg);

            saveData();
            renderMessages();
            renderContacts();
            closeInsertMessageModal();
        }

        function openAddModal() {
            document.getElementById('newContactId').value = '';
            document.getElementById('newContactName').value = '';
            const modal = document.getElementById('addContactModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.transform').classList.remove('scale-95');
                modal.querySelector('.transform').classList.add('scale-100');
            }, 10);
        }

        function closeAddModal() {

            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');

                modal.classList.add('hidden');

        function handleCreateContact(e) {
            e.preventDefault();
            const idInput = document.getElementById('newContactId').value.trim();
            const nameInput = document.getElementById('newContactName').value.trim();

            if (!idInput || !nameInput) return;

            if (contacts.some(c => c.id === idInput)) {
                showAlert("重複警告", `編號 "${idInput}" 已經存在，請使用其他編號。`, false);
                return;
            }

            const newContact = {
                id: idInput,
                name: nameInput,
                messages: []
            };

            contacts.push(newContact);
            saveData();
            renderContacts();
            closeAddModal();
            selectContact(idInput);
        }

        function showAlert(title, message, isSuccess = true) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const iconEl = document.getElementById('alertIcon');
            if (isSuccess) {
                iconEl.className = "w-14 h-14 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                iconEl.className = "w-14 h-14 rounded-full bg-red-50 text-red-600 flex items-center justify-center text-2xl mx-auto mb-4 shadow-sm";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            const modal = document.getElementById('alertModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.transform').classList.remove('scale-95');
                modal.querySelector('.transform').classList.add('scale-100');
            }, 10);
        }

        function closeAlertModal() {
            const modal = document.getElementById('alertModal');
            modal.classList.add('opacity-0');
            modal.querySelector('.transform').classList.remove('scale-100');
            modal.querySelector('.transform').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(f => '>')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
